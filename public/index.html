<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/icons/icon-32x32.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <title>Expense App</title>
    <script src="plugins/tailwindcss/tailwindcss.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <script src="plugins/vue/vue.global.js"></script>
    <link rel="stylesheet" href="plugins/fontawesome/css/all.min.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <style>
      /* Mobile Optimized Styles */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      
      html {
        overscroll-behavior: none;
      }
      
      body {
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      /* Safe Area Support */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Animations */
      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 0.2s ease;
      }
      .fade-enter-from,
      .fade-leave-to {
        opacity: 0;
      }

      .slide-up-enter-active,
      .slide-up-leave-active {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .slide-up-enter-from,
      .slide-up-leave-to {
        transform: translateY(100%);
      }

      /* Hide Scrollbar */
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Touch Feedback */
      .active\:scale-95:active {
        transform: scale(0.95);
      }

      /* Notification Transitions - Enhanced */
      .fade-enter-active {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .fade-leave-active {
        transition: all 0.3s cubic-bezier(0.55, 0.085, 0.68, 0.53);
      }
      .fade-enter-from {
        transform: translateY(-20px) scale(0.9);
        opacity: 0;
      }
      .fade-leave-to {
        transform: translateY(-10px) scale(0.95);
        opacity: 0;
      }
      .fade-move {
        transition: transform 0.3s ease;
      }
      
      /* Mobile notification adjustments */
      @media (max-width: 640px) {
        .fade-enter-from {
          transform: translateY(-15px) scale(0.95);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Vue app will render here -->
    </div>

    <!-- Vue Router CDN -->
    <script src="https://unpkg.com/vue-router@4"></script>

    <script src="utils/api.js"></script>

    <script src="components/CategoryList.js"></script>
    <script src="components/PaymentSourceForm.js"></script>
    <script src="components/PaymentSourceList.js"></script>
    <script src="components/ProfileForm.js"></script>
    <script src="components/ChangePasswordForm.js"></script>
    <script src="components/DeleteAccountSection.js"></script>
    <script src="components/QuickAddItemForm.js"></script>
    <script src="components/QuickAddItemList.js"></script>
    <script src="components/AppearanceSettings.js"></script>
    <script src="components/DataManagementSettings.js"></script>
    <script src="components/NotificationSettings.js"></script>
    <script src="components/AboutSection.js"></script>

    <!-- Views -->
    <script src="views/LoginView.js"></script>
    <script src="views/SignupView.js"></script>
    <script src="views/ForgotPasswordView.js"></script>
    <script src="views/ResetPasswordView.js"></script>

    <script src="views/DashboardView.js"></script>
    <script src="views/ProfileView.js"></script>

    <script src="views/PaymentSourcesView.js"></script>
    <script src="views/QuickAddView.js"></script>
    <script src="views/SettingsView.js"></script>

    <!-- Router Configuration -->
    <script src="router/index.js"></script>

    <!-- Main Application -->
    <script src="app.js"></script>
  </body>
</html>
